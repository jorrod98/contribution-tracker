name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case this would help with.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good solution look like?
    validations:
      required: true

